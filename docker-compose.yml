version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: quizbuzz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quizbuzz
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: quizbuzz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizbuzz -d quizbuzz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
